controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ezgripper_controller:
      type: position_controllers/GripperActionController

ezgripper_controller:
  ros__parameters:
    # This assumes the default prefix "left" used in standalone launch
    joint: left_ezgripper_knuckle_palm_L1_1
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 1.0
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    
    gains:
      left_ezgripper_knuckle_palm_L1_1: {p: 100.0, i: 0.01, d: 10.0, i_clamp: 1.0}
