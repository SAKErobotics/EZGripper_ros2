# Individual Joint Position Controllers for EZGripper
# Each controller defines a single joint to match the SCARA arm format

# Original gripper joints
gripper1_knuckle_palm_L1_1_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: left_ezgripper_knuckle_palm_L1_1
    interface_name: position
    publish_rate: 50  # Hz

gripper1_knuckle_palm_L1_2_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: left_ezgripper_knuckle_palm_L1_2
    interface_name: position
    publish_rate: 50  # Hz

# Additional joints for the triple gripper configuration
gripper2_knuckle_palm_L1_1_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper1_ezgripper_knuckle_palm_L1_1
    interface_name: position
    publish_rate: 50  # Hz

gripper2_knuckle_palm_L1_2_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper1_ezgripper_knuckle_palm_L1_2
    interface_name: position
    publish_rate: 50  # Hz

gripper3_knuckle_palm_L1_1_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper2_ezgripper_knuckle_palm_L1_1
    interface_name: position
    publish_rate: 50  # Hz

gripper3_knuckle_palm_L1_2_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper2_ezgripper_knuckle_palm_L1_2
    interface_name: position
    publish_rate: 50  # Hz

# Additional controllers for gripper3
gripper4_knuckle_palm_L1_1_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper3_ezgripper_knuckle_palm_L1_1
    interface_name: position
    publish_rate: 50  # Hz

gripper4_knuckle_palm_L1_2_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: ezgripper_gripper3_ezgripper_knuckle_palm_L1_2
    interface_name: position
    publish_rate: 50  # Hz
